<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta Municípios GO</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#345da8">
<link rel="apple-touch-icon" href="./icones/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanderlan GO">
<style>
:root{
  /* identidade Vanderlan Cardoso — ver docs/memoria/06-design.md */
  --azul:#345da8; --azul-escuro:#243f78; --azul-claro:#e8eef9; --verde:#00a651; --amarelo:#fad107;
  --ouro:#c9a227; --ouro-claro:#e6c766; --ouro-escuro:#9c7a12; --branco:#fff; --fundo:#f5f7fb;
  --texto:#1b2333; --texto-2:#4a5568;

  --bg:var(--fundo); --surface:var(--branco); --surface-2:#eef1f8; --line:#d7deec; --line-2:#e3e8f4;
  --ink:var(--texto); --ink-2:var(--texto-2); --ink-3:#7b879b;
  --accent:var(--azul); --accent-2:#4b74bd; --accent-soft:var(--azul-claro); --bar:var(--azul);
  --good:var(--verde); --good-bg:#e1f6ea; --warn:#8a6a00; --warn-bg:#fff3d6; --serious:#c2542a; --serious-bg:#fde9e0; --crit:#d03b3b; --crit-bg:#fbe3e3; --neutral-bg:#eceef4;
  --radius:10px; --shadow:0 1px 2px rgba(27,35,51,.05),0 4px 14px rgba(27,35,51,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:44px}
input:focus,select:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.hidden{display:none!important}
.assinatura{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:var(--ouro);letter-spacing:.2px}
.rodape{max-width:1320px;margin:26px auto 4px;padding:14px 18px 22px;display:flex;flex-direction:column;gap:4px;justify-content:center;align-items:center}
.rodape .assinatura{font-size:13px}
.rodape .info-atualizacao{font-size:12px;color:var(--ink-3)}
@media print{.rodape{display:none}}

/* faixa amarela de "sem internet" */
.faixa-offline{background:#fff3d6;color:#5b4700;text-align:center;font-size:13px;font-weight:600;padding:7px 10px;border-bottom:1px solid #f1dc9c;position:sticky;top:0;z-index:21}

/* topo — cabeçalho compacto: uma linha só (logo + nome + Menu) */
header.top{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.top .wrap{max-width:1320px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;line-height:1.15;min-width:0}
.logo-marca{height:40px;width:auto;display:block;border-radius:4px;flex:none}
.brand b{font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-toggle{background:#fff;border:0;min-height:44px;min-width:44px;padding:0;display:flex;align-items:center;justify-content:center;flex:none;border-radius:8px}
.menu-toggle:hover{background:#f0f0f0}
.menu-toggle .sanduiche{display:flex;flex-direction:column;gap:4px;width:22px}
.menu-toggle .sanduiche span{display:block;height:3px;width:100%;background:var(--azul,#345da8);border-radius:2px}

/* painel do menu (abas + busca + atualização + usuário) */
.menu-painel{position:fixed;left:0;right:0;z-index:19;background:var(--surface);border-bottom:1px solid var(--line-2);box-shadow:0 10px 24px rgba(0,0,0,.18);padding:12px 14px 16px;max-height:calc(100vh - 54px);overflow:auto}
nav.tabs{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
nav.tabs button{background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;color:var(--ink);opacity:1;padding:11px 14px;font-weight:700;font-size:14.5px;text-align:left;min-height:44px;width:100%}
nav.tabs button:hover{border-color:var(--accent-2);color:var(--accent)}
nav.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.menu-busca{position:relative;margin-bottom:12px}
.menu-busca input{width:100%;background:var(--surface);border:1px solid var(--line);padding-left:36px;min-height:44px}
.menu-busca svg{position:absolute;left:11px;top:14px;width:16px;height:16px;fill:none;stroke:var(--ink-3);stroke-width:2}

main{max-width:1320px;margin:0 auto;padding:18px}
.aviso{background:#fff8e1;border:1px solid #f1dc9c;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;color:#5b4700;font-size:13px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 10px;color:var(--ink)}
h3{font-size:14px;margin:18px 0 8px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.secao{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.secao h2{margin:0;font-size:17px}
.secao .small{color:var(--ink-3)}

/* barra de filtro global: trilha + campos */
.fbar{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.fb-linha1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
.fb-geral{font-weight:700;color:var(--ink);white-space:nowrap;cursor:default;text-transform:uppercase}
.fb-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.fb-chips:empty{margin-top:0}
.mig{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink-2);cursor:pointer;font-weight:600}
.mig:hover{border-color:var(--accent-2);color:var(--accent)}
.mig .k{font-weight:400;opacity:.75;margin-right:4px}
.mig .x{margin-left:6px;opacity:.6}
.mig .x:hover{opacity:1;color:var(--crit)}
.fb-toggle{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--accent);font-weight:700;min-height:38px;white-space:nowrap}
.fb-toggle:hover{border-color:var(--accent-2)}
.fb-limpar{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;min-height:32px}
.fb-limpar:hover{border-color:var(--crit);color:var(--crit)}
#filtros-campos{margin-top:8px}
.dica{font-size:12.5px;color:var(--ink-3);margin:8px 0 12px}

/* cartões de números */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line-2);border-top:3px solid var(--ouro);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.tile .lbl{font-size:12.5px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.4px}
.tile .val{font-size:28px;font-weight:700;margin-top:4px;letter-spacing:-.3px;color:var(--texto)}
.tile .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.tile.click{cursor:pointer}
.tile.click:hover{border-color:var(--accent-2)}
.tile.of{border-left:4px solid #eb6834}
.tile.em{border-left:4px solid var(--accent-2)}

/* grade de painéis */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .small{font-weight:400;color:var(--ink-3)}

/* barras horizontais */
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;padding:2px 4px;border-radius:6px;position:relative}
.bar:hover{background:var(--surface-2)}
.bar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bar .t{height:14px;background:var(--surface-2);border-radius:0 4px 4px 0;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.bar.sec .t i{background:#eb6834}
.bar .v{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.bar .v small{color:var(--ink-3)}
.mais{margin-top:6px}
.mais summary{cursor:pointer;font-size:12px;color:var(--accent)}

/* colunas (gráfico vertical) */
.cols{display:flex;align-items:flex-end;gap:6px;height:190px;padding:22px 4px 0;border-bottom:1px solid var(--line)}
.cols.denso{padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0;position:relative;border-radius:4px}
.col:hover{background:var(--surface-2)}
.col .v{font-size:11px;color:var(--ink-2);white-space:nowrap;margin-bottom:3px;font-variant-numeric:tabular-nums}
.col .b{width:70%;max-width:46px;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.col.sec .b{background:#eb6834}
.cols-x{display:flex;gap:6px;padding:4px 4px 0}
.cols-x span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* rosca */
.rosca{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.rosca svg{width:150px;height:150px}
.rosca circle.seg{cursor:pointer;transition:stroke-width .15s}
.rosca circle.seg:hover{stroke-width:30}
.rosca .centro{text-anchor:middle;font-size:10px;font-weight:700;fill:var(--ink)}
.rosca .centro2{text-anchor:middle;font-size:7px;fill:var(--ink-3)}
.legenda{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.legenda div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;cursor:pointer;padding:2px 4px;border-radius:6px}
.legenda div:hover{background:var(--surface-2)}
.legenda i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legenda .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legenda .v{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.legenda .v small{color:var(--ink-3)}
.tip{position:fixed;z-index:50;background:#1a1a19;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:320px;box-shadow:0 4px 12px rgba(0,0,0,.25)}

/* filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:8px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:150px;flex:1;max-width:260px}
.filters label.grow{flex:2;min-width:220px;max-width:none}
.filters .btn{min-height:38px}
.combo{position:relative;display:block}
.combo input{width:100%;padding-right:26px}
.combo input.ativo{border-color:var(--accent-2);background:var(--accent-soft);font-weight:600}
.combo .limpa{position:absolute;right:6px;bottom:8px;border:0;background:transparent;color:var(--ink-3);font-size:14px;padding:2px 4px;line-height:1}
.combo .limpa:hover{color:var(--crit)}
.combo .lista{position:absolute;z-index:30;left:0;right:0;top:100%;max-height:260px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-top:2px;min-width:220px}
.combo .lista div{padding:7px 10px;cursor:pointer;font-size:13px;color:var(--ink)}
.combo .lista div:hover,.combo .lista div.sel{background:var(--accent-soft);color:var(--accent)}
.combo .lista .vazio{color:var(--ink-3);cursor:default;font-size:12px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 16px;color:var(--ink);font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent-2);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);color:#fff}
.btn.ok{background:var(--verde);color:#fff;border-color:var(--verde)}
.btn.ok:hover{background:#008f46;border-color:#008f46;color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;min-height:32px}
.resumo{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:0 0 10px;color:var(--ink-2);font-size:13px}
.resumo b{color:var(--ink);font-size:15px}

/* tabelas */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-2);white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
th.sorted::after{content:" ▾";color:var(--accent)} th.sorted.asc::after{content:" ▴"}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:#f8f8f5}
tr.total td{font-weight:700;background:var(--surface-2)}
td .m{font-weight:600;color:var(--accent);cursor:pointer}
td .m:hover{text-decoration:underline}
td .f{cursor:pointer;border-bottom:1px dotted var(--ink-3)}
td .f:hover{color:var(--accent);border-bottom-color:var(--accent)}
td.acoes button{margin-right:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--neutral-bg);color:var(--ink-2);cursor:pointer}
.badge.PAGA{background:var(--good-bg);color:#0a6b0a}
.badge.ENTREGUE{background:#dcefe8;color:#0f6b4a}
.badge.EMPENHADA{background:var(--warn-bg);color:var(--warn)}
.badge.INDICADA,.badge.CADASTRADA{background:var(--accent-soft);color:var(--accent)}
.badge.AGUARDANDO{background:var(--serious-bg);color:var(--serious)}
.badge.EM{background:#f6e6f0;color:#8d2f63}
.badge.CANCELADA{background:var(--crit-bg);color:var(--crit)}
.badge.SIM{background:var(--good-bg);color:#0a6b0a}
mark{background:#fff1a8;color:inherit;padding:0 1px;border-radius:2px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;color:var(--ink-2);font-size:13px}

/* lista de municípios */
.mun-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.mun{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mun:hover{border-color:var(--accent-2);transform:translateY(-1px)}
.mun .name{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.mun .name .reg{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase}
.mun .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-2)}
.mun .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.mun .mini{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.mun .mini i{display:block;height:100%;background:var(--bar)}

/* ficha do município */
.ficha-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ficha-top h1{margin:0}
.ficha-top .sub{color:var(--ink-2);margin-top:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--ink-2);font-weight:600;white-space:nowrap}
.kv dd{margin:0;overflow-wrap:anywhere}
.pessoa{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.pessoa:last-child{border-bottom:0}
.pessoa .cargo{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:600}
.pessoa .nome{font-weight:600}
.pessoa .det{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.tel{display:inline-block;background:var(--surface-2);border-radius:6px;padding:1px 7px;font-size:12px;margin:1px 2px 1px 0;color:var(--ink);white-space:nowrap}
.tel:hover{background:#d5e5f8;text-decoration:none}
.texto{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.5}
.nota{font-size:12px;color:var(--ink-3);margin-top:6px}
.ranking li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.ranking{list-style:none;margin:0;padding:0;counter-reset:r}
.ranking li::before{counter-increment:r;content:counter(r) ".";color:var(--ink-3);width:22px;flex:none}
.ranking li span:first-of-type{flex:1;cursor:pointer;color:var(--accent);font-weight:600}
.ranking li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* resultado da busca */
.res-grp{margin-bottom:14px}
.res-grp h3{margin-top:6px}
.res{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;cursor:pointer}
.res:hover{border-color:var(--accent-2)}
.res .t{font-weight:600}
.res .d{color:var(--ink-2);font-size:12.5px}

/* login / telas cheias */
.overlay-full{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.overlay-full.azul{background:linear-gradient(180deg,var(--azul-escuro),var(--azul));flex-direction:column;gap:18px}
.overlay-full.azul .logo-login{height:96px;width:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.overlay-full.azul .rodape{margin-top:0}
.overlay-full.azul .rodape .assinatura{color:var(--ouro-claro)}
.auth-card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:0 10px 34px rgba(0,0,0,.25);padding:28px 30px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.auth-card h1{font-size:20px;margin:0 0 2px;color:var(--texto)}
.auth-card label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--ink-2)}
.auth-card button{width:100%;font-size:16px}
.form-erro{background:var(--crit-bg);color:var(--crit);border-radius:8px;padding:9px 11px;font-size:13.5px}

/* topo: usuário logado */
.userbox{display:flex;flex-direction:column;align-items:stretch;gap:8px;color:var(--ink);font-size:13px}
.userbox .userinfo{white-space:normal;font-weight:600;color:var(--ink)}
.userbox .atualizacao{font-size:11.5px;opacity:.85;white-space:normal;color:var(--ink-3)}
.userbox .btn{background:var(--surface-2);border-color:var(--line);color:var(--ink);width:100%}
.userbox .btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-2)}

/* toasts */
.toasts{position:fixed;bottom:16px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{background:#1a1a19;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:1;transition:opacity .3s,transform .3s}
.toast.erro{background:var(--crit)}
.toast.saindo{opacity:0;transform:translateY(6px)}

/* modal */
.modal-backdrop{position:fixed;inset:0;z-index:200;background:rgba(10,10,10,.45);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,.3);padding:20px 22px;width:100%;max-width:580px;max-height:92vh;overflow:auto;position:relative}
.modal-x{position:absolute;top:8px;right:8px;background:transparent;border:0;font-size:16px;color:var(--ink-3);padding:6px}
.modal-x:hover{color:var(--crit)}
.modal h2{margin-top:0}

/* formulários */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2)}
.form-grid label.grow{grid-column:1/-1}
.form-grid textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.form-grid h3{grid-column:1/-1;margin:8px 0 0}
.form-acoes{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.kv.confirm{background:var(--surface-2);border-radius:8px;padding:10px 14px}
.carregando-inline{color:var(--ink-3);padding:20px 0}

@media print{
  header.top,.menu-painel,.filters,.btn,.pager,.dica{display:none!important}
  body{background:#fff} main{max-width:none;padding:0}
  .card,.tbl-wrap,.tile{box-shadow:none;break-inside:avoid}
  th{position:static}
}
@media (max-width:640px){
  .bar{grid-template-columns:minmax(80px,45%) 1fr auto}
  .kv{grid-template-columns:1fr} .kv dt{margin-top:6px}
  .rosca{grid-template-columns:120px 1fr} .rosca svg{width:120px;height:120px}
  .filters label{max-width:none}
}
@media (max-width:480px){
  .modal-backdrop{padding:0}
  .modal{padding:16px;max-width:100%;width:100%;height:100%;max-height:100%;border-radius:0}
  .auth-card{padding:22px 18px}
  .overlay-full.azul .logo-login{height:72px}
  .form-grid{grid-template-columns:1fr}
  .form-acoes{flex-direction:column-reverse}
  .form-acoes .btn{width:100%}
  .secao{flex-direction:column;align-items:stretch}
  .secao .btn.primary,.secao .btn.ok{width:100%}
  .tiles{grid-template-columns:repeat(2,1fr);gap:8px}
  .tile .val{font-size:26px}
  .grid{grid-template-columns:1fr}
  .top .wrap{padding:8px 12px;gap:8px}
  table th:first-child,table td:first-child{position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:2px 0 4px rgba(27,35,51,.08)}
  table th:first-child{background:var(--surface-2);z-index:3}
  .resumo{gap:8px 14px}
}
</style>
</head>

<div id="toasts" class="toasts"></div>
<div id="faixa-offline" class="faixa-offline hidden"></div>

<div id="login-overlay" class="overlay-full azul hidden">
  <img class="logo-marca logo-login" alt="Senador Vanderlan Cardoso">
  <form id="form-login" class="auth-card">
    <h1>Consulta Municípios GO</h1>
    <p class="muted small">Fichas de atendimento · gabinete do Senador Vanderlan Cardoso</p>

  <div class="rodape"><span class="assinatura">by Raul Jardim</span></div>
</div>

<div id="troca-overlay" class="overlay-full azul hidden">
  <img class="logo-marca logo-login" alt="Senador Vanderlan Cardoso">
  <form id="form-troca-obrig" class="auth-card">
    <h1>Crie sua nova senha</h1>

    <button class="btn ok" type="submit">Salvar e continuar</button>
  </form>
  <div class="rodape"><span class="assinatura">by Raul Jardim</span></div>
</div>

<div id="carregando" class="overlay-full hidden"><div class="auth-card" style="text-align:center">Carregando…</div></div>

</div></header>
<div id="menu-painel" class="menu-painel hidden">

</div>

<script>
// ---------- utilidades ----------
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const fmtBRL = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2});
const fmtInt = new Intl.NumberFormat('pt-BR');
const brl = v => v==null ? '—' : fmtBRL.format(v);
const brlCurto = v => { if(v==null) return '—'; const a=Math.abs(v); if(a>=1e9) return 'R$ '+(v/1e9).toLocaleString('pt-BR',{maximumFractionDigits:2})+' bi'; if(a>=1e6) return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi'; if(a>=1e3) return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil'; return fmtBRL.format(v); };
const int = v => v==null ? '—' : fmtInt.format(v);
const pct = (a,b) => b ? (a/b*100).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%' : '—';
const norm = s => (s==null?'':String(s)).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq = a => [...new Set(a.filter(x=>x!=null && x!==''))];
const sum = (a,f) => a.reduce((s,x)=>s+((f?f(x):x)||0),0);
const tituloCase = s => (s||'').toLowerCase().replace(/(^|\s|-|\()([a-zà-ú])/g,(m,p,c)=>p+c.toUpperCase()).replace(/\bDe\b/g,'de').replace(/\bDo\b/g,'do').replace(/\bDa\b/g,'da').replace(/\bDos\b/g,'dos').replace(/\bDas\b/g,'das');
function hl(texto, q){ if(!q) return esc(texto); const t=esc(texto); const nq=norm(q); const nt=norm(t); let out='',i=0; while(true){ const k=nt.indexOf(nq,i); if(k<0){ out+=t.slice(i); break;} out+=t.slice(i,k)+'<mark>'+t.slice(k,k+nq.length)+'</mark>'; i=k+nq.length;} return out; }
function telLinks(tels){ return (tels||[]).map(t=>{ const d=t.replace(/\D/g,''); const wa = d.length>=10 ? 'https://wa.me/55'+d : null; return wa ? `<a class="tel" href="${wa}" target="_blank" title="Abrir no WhatsApp">${esc(t)}</a>` : `<span class="tel">${esc(t)}</span>`; }).join(''); }
const PHONE_RE = /\(?\d{2}\)?\s?\d\.?\d{3,4}[\s\-]?\d{4}/g;
function textoComTel(s){ return esc(s||'').replace(PHONE_RE, m=>{ const d=m.replace(/\D/g,''); return `<a class="tel" href="https://wa.me/55${d}" target="_blank" title="Abrir no WhatsApp">${m}</a>`; }); }
const PALETA = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948','#8a8984'];
const COR_SIT = {'PAGA':'#008300','ENTREGUE':'#1baf7a','EMPENHADA':'#eda100','INDICADA':'#2a78d6','CADASTRADA':'#4a3aa7','AGUARDANDO ENTREGA':'#eb6834','EM EXECUÇÃO':'#e87ba4','CANCELADA':'#e34948','OUTRA':'#8a8984','NÃO INFORMADA':'#b5b4ae','SIM':'#008300','NÃO':'#c9c8c2'};

// ---------- grupo de situação (espelha grupo_situacao do banco/extrator) ----------
function grupoSituacao(s){
  const n = norm(s);
  if(!n) return 'NÃO INFORMADA';
  if(/CANCEL|ANULADO|IMPRODUTIVO|NAO CONTRATADA/.test(n)) return 'CANCELADA';
  if(/EXECUCAO|EM OBRA|EM ANDAMENTO/.test(n)) return 'EM EXECUÇÃO';
  if(/LICITAD|AGUARDANDO ENTREG|AGUARDANDO A ENTREG|AGUARDANDO A CHEGADA/.test(n)) return 'AGUARDANDO ENTREGA';
  if(/ENTREGUE|EMTREGUE|EXECUTADA|FINALIZADA|INSTALADO|PERFURADO/.test(n)) return 'ENTREGUE';
  if(n.startsWith('PAGA') || /PAGA|PAGO|LIBERADO/.test(n)) return 'PAGA';
  if(/RETIRADO|PATIO/.test(n)) return 'AGUARDANDO ENTREGA';
  if(/EMPENH/.test(n)) return 'EMPENHADA';
  if(/INDICA|COMPROMISSO/.test(n)) return 'INDICADA';
  if(/CADASTR/.test(n)) return 'CADASTRADA';
  return 'OUTRA';
}

// ---------- RPC (fetch puro, sem bibliotecas) ----------
class RpcError extends Error{ constructor(codigo, texto){ super(texto); this.codigo=codigo; this.texto=texto; } }
async function rpc(fn, args={}){
  let r;
  try{
    r = await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn, {
      method:'POST',
      headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify(args)
    });
  }catch(e){ throw new RpcError('SEM_CONEXAO','Não foi possível falar com o servidor. Confira sua internet.'); }
  let j=null; try{ j = await r.json(); }catch(e){}
  if(!r.ok){
    const raw = (j && j.message) || (j && j.error_description) || 'Erro desconhecido do servidor.';
    const i = String(raw).indexOf(': ');
    const codigo = i>=0 ? raw.slice(0,i) : '';
    const texto = i>=0 ? raw.slice(i+2) : raw;
    if(codigo==='SESSAO_INVALIDA'){ localStorage.removeItem('cmgo_token'); SESSAO=null; mostrarLogin(texto); }
    throw new RpcError(codigo, texto);
  }
  return j;
}

function comTempoLimite(promessa, ms=8000){

// ---------- dados salvos no aparelho (IndexedDB) para uso sem internet ----------
const IDB_NOME='cmgo', IDB_VERSAO=1, IDB_STORE='cache';
function abrirIDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('sem indexedDB')); return; }
    const req = indexedDB.open(IDB_NOME, IDB_VERSAO);
    req.onupgradeneeded = () => { const db=req.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE,{keyPath:'chave'}); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSalvar(registro){
  try{
    const db = await abrirIDB();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(registro);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  }catch(e){ /* aparelho sem IndexedDB (ex.: navegação privada) — segue sem salvar */ }
}
async function idbLer(chave){
  try{
    const db = await abrirIDB();
    return await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get(chave);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return null; }
}

function recalcular(){
  DADOS.forEach(m=>{
    m.emendas = m.emendas||[];
    m.oficios = m.oficios||[];
    m.emendas.forEach(e=>{ e.municipio=m.municipio; e.regiao=m.regiao||'(sem região)'; e.ano=String(e.ano||'?'); if(!e.situacao_grupo) e.situacao_grupo=grupoSituacao(e.situacao); });
    m.oficios.forEach(o=>{ o.municipio=m.municipio; o.regiao=m.regiao||'(sem região)'; o.ano=String(o.ano||'?'); o.atendido_flag = (o.atendido||'').trim()? 'SIM':'NÃO'; });
    m.emendas_total = sum(m.emendas, e=>e.valor);
    m.emendas_qtd = m.emendas.length;
    m.oficios_qtd = m.oficios.length;
    m.oficios_valor_total = sum(m.oficios, o=>o.valor_solicitado);
    m.oficios_atendidos = m.oficios.filter(o=>o.atendido_flag==='SIM').length;
    m.prefeito_partido = (m.prefeito||{}).partido || '';
    const p = m.prefeito||{};
    m._busca = norm([m.municipio,m.regiao,p.texto,(m.vice_prefeito||{}).texto,(m.presidente_camara||{}).texto,m.primeira_dama,m.secretario_saude,m.psd_presidente,m.vereadores_psd,m.companheiros,m.dep_federal,m.dep_estadual,m.eleicao_2020,m.eleicao_2024,(m.observacoes||[]).join(' ')].join(' | '));
  });
  MUNS = DADOS.filter(m=>m.tipo!=='nacional');
  EMENDAS = DADOS.flatMap(m=>m.emendas);
  OFICIOS = DADOS.flatMap(m=>m.oficios);
  byName = Object.fromEntries(DADOS.map(m=>[m.municipio,m]));
  const contatos = [];
  DADOS.forEach(m=>{
    const add=(cargo,p)=>{ if(!p) return; if(typeof p==='string'){ const nome=p.split(/\(|\/\/|–| - |\s\/\s/)[0].replace(/\b\d{1,2}\/\d{2}\b/g,'').replace(/[\d\-\s]+$/,'').trim(); contatos.push({municipio:m.municipio,cargo,nome,partido:'',telefones:(p.match(PHONE_RE)||[]),texto:p}); } else { contatos.push({municipio:m.municipio,cargo,nome:p.nome||'',partido:p.partido||'',telefones:p.telefones||[],email:p.email||'',texto:p.texto||''}); } };
    add((m.prefeito||{}).cargo||'Prefeito(a)', m.prefeito);
    add('Vice-prefeito(a)', m.vice_prefeito);
    add('Presidente da Câmara', m.presidente_camara);
    if(m.primeira_dama) add('Primeira-dama / cônjuge', m.primeira_dama);
    if(m.secretario_saude) add('Secretário(a) de Saúde', m.secretario_saude);
    if(m.psd_presidente) add('Presidente do PSD', m.psd_presidente);
    if(m.vereadores_psd) m.vereadores_psd.split(/\s*\/\/\s*|\s+\/\s+/).forEach(v=>add('Vereador(a) PSD', v));
    if(m.companheiros) m.companheiros.split(/\s*\/\/\s*|\s+\/\s+/).forEach(v=>{ if(v.trim()) add('Companheiro(a)', v.trim()); });
    if(m.dep_federal) add('Dep. federal parceiro', m.dep_federal);
    if(m.dep_estadual) add('Dep. estadual parceiro', m.dep_estadual);
  });
  contatos.forEach(c=>c._busca=norm([c.municipio,c.cargo,c.nome,c.partido,c.texto,(c.telefones||[]).join(' ')].join(' | ')));
  CONTATOS = contatos;
  OPCOES = {
    municipio: DADOS.map(m=>m.municipio),
    ministerio: uniq([...EMENDAS.map(e=>e.ministerio),...OFICIOS.map(o=>o.ministerio)]).sort(),
    ano: uniq([...EMENDAS.map(e=>e.ano),...OFICIOS.map(o=>o.ano)]).sort(),
    situacao: uniq(EMENDAS.map(e=>e.situacao_grupo)).sort(),
    regiao: uniq(DADOS.map(m=>m.regiao)).sort(),
    atendido: ['SIM','NÃO'],
    partido: uniq(DADOS.map(m=>m.prefeito_partido)).sort(),
    psd: ['TEM','NÃO TEM'],
    cargo: uniq(CONTATOS.map(c=>c.cargo)),
  };
  SETS = Object.fromEntries(Object.entries(OPCOES).map(([k,v])=>[k,new Set(v.map(norm))]));
  atualizarDatalists();
}
function atualizarDatalists(){
  const dm=$('#dl-municipios'), di=$('#dl-ministerios');
  if(dm) dm.innerHTML = DADOS.map(m=>`<option value="${esc(tituloCase(m.municipio))}">`).join('');

function acharEmendaPorId(id){ for(const m of DADOS){ const e=(m.emendas||[]).find(x=>x.id===id); if(e) return {municipio:m, emenda:e}; } return null; }
function acharOficioPorId(id){ for(const m of DADOS){ const o=(m.oficios||[]).find(x=>x.id===id); if(o) return {municipio:m, oficio:o}; } return null; }
// "casa": filtro exato quando o texto é uma opção da lista; senão, "contém" (digitou "goian" -> todos com goian)
function casa(filtro, valor, chave){ if(!filtro) return true; const nf=norm(filtro).trim(); if(!nf) return true; const nv=norm(valor); if(nv===nf) return true; if(chave && SETS[chave] && SETS[chave].has(nf)) return false; return nv.includes(nf); }

function filtraEmendas(f=F(), q=''){ const nq=norm(q); return EMENDAS.filter(e=>munOk(byName[e.municipio],f)&&casa(f.ministerio,e.ministerio,'ministerio')&&casa(f.ano,e.ano,'ano')&&casa(f.situacao,e.situacao_grupo,'situacao')&&(!nq||norm(e.objeto+' '+e.situacao+' '+e.municipio).includes(nq))); }
function filtraOficios(f=F(), q=''){ const nq=norm(q); return OFICIOS.filter(x=>munOk(byName[x.municipio],f)&&casa(f.ministerio,x.ministerio,'ministerio')&&casa(f.ano,x.ano,'ano')&&casa(f.atendido,x.atendido_flag,'atendido')&&(!nq||norm([x.objeto,x.solicitante,x.recebido,x.municipio].join(' ')).includes(nq))); }
function filtraMunicipios(f=F()){ // municípios do recorte: atributos + (se houver filtro de emenda/ofício) ter registro que casa

  const s=new Set([...filtraEmendas(f).map(e=>e.municipio),...filtraOficios(f).map(o=>o.municipio)]);

function ligarCombos(el, cb){
  $$('.combo', el).forEach(c=>{
    const inp=$('input',c), lista=$('.lista',c), limpa=$('.limpa',c); const opcoes=OPCOES[inp.dataset.opcoes]||[]; const id=inp.dataset.f; let sel=-1, tmr;
    const rot = v => id==='municipio' ? tituloCase(v) : v;
    const mostrar=()=>{ const q=norm(inp.value).trim(); const hits=(q?opcoes.filter(o=>norm(o).includes(q)):opcoes).slice(0,80); sel=-1;
      lista.innerHTML = hits.length ? hits.map(o=>`<div data-v="${esc(o)}">${hl(rot(o),inp.value)}</div>`).join('') : `<div class="vazio">nenhuma opção com “${esc(inp.value)}” — o filtro usa o texto digitado (contém)</div>`;
      lista.classList.remove('hidden'); };
    const aplicar=v=>{ clearTimeout(tmr); inp.value=v; setFiltro(id,v); lista.classList.add('hidden'); cb(false); };
    inp.addEventListener('focus', mostrar);
    inp.addEventListener('input', ()=>{ mostrar(); limpa.style.display=inp.value?'':'none'; clearTimeout(tmr); tmr=setTimeout(()=>{ setFiltro(id,inp.value); cb(true); },300); });
    inp.addEventListener('keydown', e=>{ const its=$$('div[data-v]',lista); if(e.key==='ArrowDown'){ sel=Math.min(sel+1,its.length-1); its.forEach((d,i)=>d.classList.toggle('sel',i===sel)); its[sel]&&its[sel].scrollIntoView({block:'nearest'}); e.preventDefault(); }
      else if(e.key==='ArrowUp'){ sel=Math.max(sel-1,0); its.forEach((d,i)=>d.classList.toggle('sel',i===sel)); e.preventDefault(); }
      else if(e.key==='Enter'){ e.preventDefault(); if(sel>=0&&its[sel]) aplicar(its[sel].dataset.v); else if(its.length===1) aplicar(its[0].dataset.v); else aplicar(inp.value); }
      else if(e.key==='Escape'){ lista.classList.add('hidden'); } });
    lista.addEventListener('mousedown', e=>{ const d=e.target.closest('div[data-v]'); if(d){ e.preventDefault(); aplicar(d.dataset.v);} });
    inp.addEventListener('blur', ()=>setTimeout(()=>lista.classList.add('hidden'),150));
    limpa.addEventListener('click', ()=>aplicar(''));
  });
}
function ligarLocais(el, l, cb){ // campos locais da aba (busca por texto, ordenação, paginação)
  $$('[data-l]', el).forEach(i=>i.addEventListener(i.tagName==='SELECT'?'change':'input', e=>{ l[i.dataset.l]=e.target.value; if('page' in l) l.page=0; cb(true); }));
  $$('[data-sort]', el).forEach(t=>t.addEventListener('click', ()=>{ const k=t.dataset.sort; if(l.sort===k) l.dir=-l.dir; else { l.sort=k; l.dir = (k==='valor'||k==='valor_solicitado'||k==='ano')?-1:1; } cb(); }));
  $$('[data-pg]', el).forEach(b=>b.addEventListener('click', ()=>{ l.page+=Number(b.dataset.pg); cb(); }));
}
// atualiza só as partes de #barra que podem mudar sem digitação (migalhas, "Limpar tudo", estado "ativo" dos combos)
// — nunca recria os <input>, então o combo em digitação e o teclado do celular não são perdidos.
function atualizarBarra(){
  const barraEl = $('#barra'); if(!barraEl) return;
  const chipsEl = $('#fb-chips', barraEl);
  if(chipsEl) chipsEl.innerHTML = estado.ordem.map(k=>`<span class="mig" data-rem="${k}" title="Clique para tirar este filtro"><span class="k">${DIMS[k]}:</span>${esc(rotFiltro(k,estado.f[k]))}<span class="x">✕</span></span>`).join('');
  let btn = $('.fb-limpar', barraEl);
  if(estado.ordem.length){
    if(!btn){ const linha=$('.fb-linha1', barraEl); if(linha){ btn=document.createElement('button'); btn.type='button'; btn.className='fb-limpar'; btn.setAttribute('data-limpar-tudo',''); btn.textContent='Limpar tudo'; linha.appendChild(btn); } }
  } else if(btn){ btn.remove(); }
  $$('.combo', barraEl).forEach(c=>{ const inp=$('input',c); if(!inp||inp===document.activeElement) return; const id=inp.dataset.f; inp.classList.toggle('ativo', !!estado.f[id]); const lm=$('.limpa',c); if(lm) lm.style.display = estado.f[id] ? '' : 'none'; });
}
// liga a barra de filtros (combos + campo(s) locais da aba). Chamada só quando #barra é reconstruída inteira.
function ligarBarra(l, renderFn){
  const barraEl = $('#barra'); if(!barraEl) return;
  const cb = (digitando) => { if(digitando){ renderFn(true); } else { filtrosAbertos=false; renderFn(); } };
  ligarCombos(barraEl, cb);
  if(l) ligarLocais(barraEl, l, cb);
  const tg = $('#fb-toggle', barraEl);
  if(tg) tg.addEventListener('click', ()=>{
    filtrosAbertos = !filtrosAbertos;
    const campos = $('#filtros-campos', barraEl); if(campos) campos.classList.toggle('hidden', !filtrosAbertos);
    tg.setAttribute('aria-expanded', String(filtrosAbertos));
    const seta = $('.seta', tg); if(seta) seta.textContent = filtrosAbertos ? '▴' : '▾';
  });
}
// liga ordenação/paginação de tabela dentro de #conteudo (recriado a cada render; não precisa preservar foco)
function ligarConteudoLocal(l, renderFn){ if(l) ligarLocais($('#conteudo'), l, ()=>renderFn()); }

// gráficos ------------------------------------------------------------
// barras horizontais — items: [{n, v, q, tip}] ; opts: {fmt, dim, limite, rotulo, mun, sec, mostrarQ, aba}
function barras(items, opts={}){
  const max=Math.max(...items.map(i=>i.v),1); const f=opts.fmt||brlCurto; const lim=opts.limite||items.length; const vis=items.slice(0,lim);
  const linha=i=>`<div class="bar ${opts.sec?'sec':''}" data-tip="${esc(i.tip||(i.n+': '+f(i.v)+(i.q!=null?' · '+int(i.q)+' registro(s)':'')))}" ${opts.dim?fAttr(opts.dim,i.n,opts.aba):(i.go?`data-go='${esc(JSON.stringify(i.go))}'`:'')} ${opts.mun?`data-mun="${esc(i.n)}"`:''}><span class="n">${esc(opts.rotulo?opts.rotulo(i.n):i.n)}</span><span class="t"><i style="width:${(i.v/max*100).toFixed(1)}%"></i></span><span class="v">${f(i.v)}${i.q!=null&&opts.mostrarQ?` <small>(${int(i.q)})</small>`:''}</span></div>`;
  return `<div class="bars">${vis.map(linha).join('')}</div>${items.length>lim?`<details class="mais"><summary>ver todos os ${items.length}</summary><div class="bars" style="margin-top:6px">${items.slice(lim).map(linha).join('')}</div></details>`:''}`;
}
function colunas(items, opts={}){
  const max=Math.max(...items.map(i=>i.v),1); const f=opts.fmt||brlCurto; const denso=items.length>=8;
  return `<div class="cols ${denso?'denso':''}">${items.map(i=>`<div class="col ${opts.sec?'sec':''}" data-tip="${esc(i.tip||(i.n+': '+f(i.v)+(i.q!=null?' · '+int(i.q)+' registro(s)':'')))}" ${opts.dim?fAttr(opts.dim,i.n,opts.aba):''}>${denso?'':`<span class="v">${f(i.v)}</span>`}<span class="b" style="height:${Math.max(1,i.v/max*100).toFixed(1)}%"></span></div>`).join('')}</div><div class="cols-x">${items.map(i=>`<span title="${esc(i.n)}">${esc(i.n)}</span>`).join('')}</div>${denso?'<div class="nota">Passe o mouse em cada coluna para ver o valor.</div>':''}`;
}
function rosca(items, opts={}){
  const total=sum(items,i=>i.v)||1; const f=opts.fmt||brlCurto; const r=42, C=2*Math.PI*r; let off=0;
  const cor=(n,i)=>opts.cores&&opts.cores[n]||PALETA[i%PALETA.length];
  const segs=items.map((i,k)=>{ const len=i.v/total*C; const s=`<circle class="seg" cx="60" cy="60" r="${r}" fill="none" stroke="${cor(i.n,k)}" stroke-width="22" stroke-dasharray="${Math.max(0,len-1.5)} ${C-Math.max(0,len-1.5)}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)" data-tip="${esc(i.n+': '+f(i.v)+' ('+pct(i.v,total)+')')}" ${opts.dim?fAttr(opts.dim,i.n,opts.aba):''}></circle>`; off+=len; return s; }).join('');
  return `<div class="rosca"><svg viewBox="0 0 120 120">${segs}<text class="centro" x="60" y="58">${esc(opts.centro||f(total))}</text><text class="centro2" x="60" y="72">${esc(opts.centro2||'total')}</text></svg>
  <div class="legenda">${items.map((i,k)=>`<div ${opts.dim?fAttr(opts.dim,i.n,opts.aba):''} data-tip="${esc(i.n+': '+f(i.v)+' ('+pct(i.v,total)+')'+(i.q!=null?' · '+int(i.q)+' registro(s)':''))}"><i style="background:${cor(i.n,k)}"></i><span class="n">${esc(i.n)}</span><span class="v">${f(i.v)} <small>${pct(i.v,total)}</small></span></div>`).join('')}</div></div>`;
}
function badge(s, link=true){ const g=(s||'').split(' ')[0]; return `<span class="badge ${esc(g)}" title="${esc(s)}" ${link?fAttr('situacao',s):''}>${esc(s)}</span>`; }
function th(label, key, l, cls=''){ return `<th class="${cls} ${l.sort===key?'sorted':''} ${l.dir>0?'asc':''}" data-sort="${key}">${label}</th>`; }
function ordenar(arr, key, dir){ return [...arr].sort((a,b)=>{ let x=a[key], y=b[key]; if(x==null) return 1; if(y==null) return -1; if(typeof x==='number'&&typeof y==='number') return (x-y)*dir; return String(x).localeCompare(String(y),'pt-BR')*dir; }); }
function csv(rows, cols, nome){ const linhas=[cols.map(c=>c.label).join(';')].concat(rows.map(r=>cols.map(c=>{ let v=c.get?c.get(r):r[c.key]; if(v==null) v=''; if(typeof v==='number') v=String(v).replace('.',','); return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';'))); const blob=new Blob(['﻿'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; a.click(); }
function pager(l, total){ const pages=Math.ceil(total/PAGE); if(pages<=1) return ''; return `<div class="pager"><button class="btn sm" data-pg="-1" ${l.page<=0?'disabled':''}>‹ Anterior</button> página ${l.page+1} de ${pages} <button class="btn sm" data-pg="1" ${l.page>=pages-1?'disabled':''}>Próxima ›</button></div>`; }
const COLS_E=[{label:'Município',key:'municipio'},{label:'Região',key:'regiao'},{label:'Ministério',key:'ministerio'},{label:'Ano',key:'ano'},{label:'Objeto',key:'objeto'},{label:'Valor',key:'valor'},{label:'Situação',key:'situacao'},{label:'Situação (grupo)',key:'situacao_grupo'}];

function tabelaEmendas(rows, o={}){ const l=o.l||{sort:'',dir:1}; const acoes=!!o.acoes; return `<div class="tbl-wrap"><table><thead><tr>${o.semMunicipio?'':th('Município','municipio',l)}${th('Ministério','ministerio',l)}${th('Ano','ano',l)}${th('Objeto','objeto',l)}${th('Valor','valor',l,'num')}${th('Situação','situacao_grupo',l)}${acoes?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(e=>`<tr>${o.semMunicipio?'':`<td><span class="m" data-mun="${esc(e.municipio)}">${esc(tituloCase(e.municipio))}</span></td>`}<td>${fl('ministerio',e.ministerio)}</td><td>${fl('ano',e.ano)}</td><td>${o.q?hl(e.objeto,o.q):esc(e.objeto)}</td><td class="num">${brl(e.valor)}</td><td>${badge(e.situacao_grupo)}${e.situacao&&e.situacao!==e.situacao_grupo?`<div class="small muted">${esc(e.situacao)}</div>`:''}</td>${acoes?`<td class="small acoes"><button type="button" class="btn sm" data-editar-emenda="${e.id}">✎ Editar</button><button type="button" class="btn sm" data-excluir-emenda="${e.id}">🗑 Excluir</button></td>`:''}</tr>`).join('')}
  ${rows.length?`<tr class="total"><td colspan="${o.semMunicipio?3:4}">Total (${int(rows.length)} emendas)</td><td class="num">${brl(sum(rows,e=>e.valor))}</td><td colspan="${acoes?2:1}"></td></tr>`:`<tr><td colspan="${6+(acoes?1:0)}" class="muted">Nenhuma emenda encontrada.</td></tr>`}</tbody></table></div>`; }
function tabelaOficios(rows,o={}){ const l=o.l||{sort:'',dir:1}; const acoes=!!o.acoes; return `<div class="tbl-wrap"><table><thead><tr>${o.semMunicipio?'':th('Município','municipio',l)}${th('Ministério','ministerio',l)}${th('Ano','ano',l)}${th('Pedido (objeto)','objeto',l)}${th('Valor solicitado','valor_solicitado',l,'num')}${th('Como chegou','recebido',l)}${th('Data','data_recebido',l)}${th('Quem pediu','solicitante',l)}${th('Atendido','atendido_flag',l)}${acoes?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(x=>`<tr>${o.semMunicipio?'':`<td><span class="m" data-mun="${esc(x.municipio)}">${esc(tituloCase(x.municipio))}</span></td>`}<td>${fl('ministerio',x.ministerio)}</td><td>${fl('ano',x.ano)}</td><td>${o.q?hl(x.objeto,o.q):esc(x.objeto)}</td><td class="num">${x.valor_solicitado?brl(x.valor_solicitado):'<span class="muted">sem valor</span>'}</td><td class="small">${esc(x.recebido)}</td><td class="small" style="white-space:nowrap">${esc(x.data_recebido)}</td><td class="small">${o.q?hl(x.solicitante,o.q):esc(x.solicitante)}</td><td>${x.atendido_flag==='SIM'?`<span class="badge SIM" ${fAttr('atendido','SIM')}>${esc(x.atendido)}</span>`:`<span class="muted f" ${fAttr('atendido','NÃO')}>—</span>`}</td>${acoes?`<td class="small acoes"><button type="button" class="btn sm" data-editar-oficio="${x.id}">✎ Editar</button><button type="button" class="btn sm" data-excluir-oficio="${x.id}">🗑 Excluir</button></td>`:''}</tr>`).join('')}

function renderPainel(soConteudo){
  const f=estado.f; const raiz=!temFiltro();
  const em=filtraEmendas(), of=filtraOficios(), muns=filtraMunicipios();
  const munE=uniq(em.map(e=>e.municipio)), munO=uniq(of.map(o=>o.municipio));
  const ok=em.filter(e=>['PAGA','ENTREGUE'].includes(e.situacao_grupo)); const totE=sum(em,e=>e.valor), totOk=sum(ok,e=>e.valor), totO=sum(of,o=>o.valor_solicitado);
  const fixo=k=>!!f[k];
  const dimsE=[['ministerio','Emendas por ministério','barras'],['ano','Emendas por ano de destinação','colunas'],['situacao','Situação das emendas','rosca'],['regiao','Emendas por região','barras'],['municipio','Emendas por município','barras'],['partido','Emendas por partido do prefeito','barras']].filter(d=>!fixo(d[0]));

  const chaveO={ministerio:o=>o.ministerio,ano:o=>o.ano,atendido:o=>o.atendido_flag,regiao:o=>o.regiao,municipio:o=>o.municipio};
  const cardE=([dim,titulo,tipo])=>{ const items=agrupar(em,chaveE[dim],e=>e.valor); const qs={}; em.forEach(e=>{ const k=chaveE[dim](e); qs[k]=(qs[k]||0)+1; }); items.forEach(i=>i.q=qs[i.n]); if(items.length<=1) return ''; if(dim==='ano') items.sort((a,b)=>a.n.localeCompare(b.n));
    const corpo = tipo==='colunas'?colunas(items,{dim}) : tipo==='rosca'?rosca(items,{dim,cores:COR_SIT,centro:brlCurto(totE),centro2:int(em.length)+' emendas'}) : barras(items,{dim,limite:dim==='municipio'?15:14,mostrarQ:true,rotulo:dim==='municipio'?tituloCase:null});
    return `<div class="card"><h2>${titulo} <span class="small">${items.length} ${dim==='municipio'?'municípios':'itens'} · valor (qtd)</span></h2>${corpo}</div>`; };
  const cardO=([dim,titulo,tipo])=>{ const items=agrupar(of,chaveO[dim]); const vm={}; of.forEach(o=>{ const k=chaveO[dim](o); vm[k]=(vm[k]||0)+(o.valor_solicitado||0); }); items.forEach(i=>{ i.tip=`${dim==='municipio'?tituloCase(i.n):i.n}: ${int(i.v)} pedido(s) · ${brlCurto(vm[i.n]||0)} solicitados`; }); if(items.length<=1) return ''; if(dim==='ano') items.sort((a,b)=>a.n.localeCompare(b.n));
    const corpo = tipo==='colunas'?colunas(items,{dim,fmt:int,sec:true}) : tipo==='rosca'?rosca(items,{dim,fmt:int,cores:COR_SIT,centro:int(of.length),centro2:'pedidos'}) : barras(items,{dim,fmt:int,sec:true,limite:dim==='municipio'?15:12,rotulo:dim==='municipio'?tituloCase:null});
    return `<div class="card"><h2>${titulo} <span class="small">${items.length} ${dim==='municipio'?'municípios':'itens'} · quantidade</span></h2>${corpo}</div>`; };
  const cardsE=dimsE.map(cardE).filter(Boolean), cardsO=dimsO.map(cardO).filter(Boolean);

  const tiles=`<div class="tiles">

    <div class="tile em"><div class="lbl">Valor médio</div><div class="val">${brlCurto(em.length?totE/em.length:0)}</div><div class="sub">por emenda${munE.length?' · '+brlCurto(totE/munE.length)+' por município':''}</div></div>

  </div>`;
  const extrasRaiz = raiz ? `<div class="secao"><h2>Rankings e política</h2></div><div class="grid">

    ${cardsO.length?`<div class="secao"><h2>Ofícios (pedidos recebidos)</h2><span class="small">quantidade de pedidos neste recorte · clique para abrir</span></div><div class="grid">${cardsO.join('')}</div>`:''}

    <div class="row"><span>Emendas${recorte?' (no filtro)':''}</span><b>${brl(vE)} <span class="muted">(${recorte?em.filter(e=>e.municipio===m.municipio).length:m.emendas_qtd})</span></b></div>

// ---------- BUSCA GLOBAL ----------
function renderBusca(){
  const q=estado.q, nq=norm(q), dq=q.replace(/\D/g,'');
  const muns=DADOS.filter(m=>norm(m.municipio).includes(nq));
  const ems=EMENDAS.filter(e=>norm(e.objeto+' '+e.situacao+' '+e.ministerio).includes(nq));
  const ofs=OFICIOS.filter(x=>norm([x.objeto,x.solicitante,x.recebido,x.ministerio].join(' ')).includes(nq));
  const cts=CONTATOS.filter(c=>c._busca.includes(nq)||(dq.length>=4&&c._busca.replace(/\D/g,'').includes(dq)));
  const fichas=DADOS.filter(m=>m._busca.includes(nq)&&!muns.includes(m));
  const irAba=(tab,campo)=>`<button class="btn sm" data-ir="${tab}" data-campo="${campo}">ver na aba com filtros</button>`;

function abrirModalCredenciais(login, senha){
  const link = location.href.split('#')[0];
  const texto = `Sistema: ${link}\nAcesso: ${login}\nSenha: ${senha}\nNo primeiro acesso o sistema pede para criar uma senha nova.`;

      <button type="button" class="btn primary" id="cred-whats">Enviar por WhatsApp</button>
    </div>
    <div id="cred-whats-area" class="hidden" style="margin-top:12px">
      <label>Telefone (DDD + número)<input id="cred-tel" type="tel" placeholder="62999998888"></label>
      <div class="form-acoes" style="margin-top:8px">
        <button type="button" class="btn" id="cred-agenda">Escolher da agenda</button>

      </div>
    </div>
    <div class="form-acoes" style="margin-top:14px"><button type="button" class="btn" id="cred-fechar">Fechar</button></div>`;
  abrirModal(corpo);
  $('#cred-copiar').addEventListener('click', async ()=>{
    try{ await navigator.clipboard.writeText(texto); toast('Dados copiados.'); }

  });
  $('#cred-whats').addEventListener('click', ()=> $('#cred-whats-area').classList.remove('hidden'));
  if(navigator.contacts && navigator.contacts.select){
    $('#cred-agenda').addEventListener('click', async ()=>{
      try{ const sel=await navigator.contacts.select(['tel'],{multiple:false}); const c=sel&&sel[0]; if(c && c.tel && c.tel[0]) $('#cred-tel').value=c.tel[0].replace(/\D/g,''); }
      catch(e){}
    });
  } else { const ag=$('#cred-agenda'); if(ag) ag.classList.add('hidden'); }
  $('#cred-abrir-whats').addEventListener('click', ()=>{
    const d=$('#cred-tel').value.replace(/\D/g,'');
    if(d.length<10){ toast('Telefone inválido.','erro'); return; }
    window.open('https://wa.me/55'+d+'?text='+encodeURIComponent(texto),'_blank');
  });
  $('#cred-fechar').addEventListener('click', fecharModal);
}

// ---------- AUDITORIA (gestor) ----------
function fmtData(iso){ try{ return new Date(iso).toLocaleString('pt-BR'); }catch(e){ return iso||''; } }
function resumoDiff(antes,depois){
  if(!antes && depois) return 'Criado';
  if(antes && !depois) return 'Removido';
  if(!antes || !depois) return '';
  const campos=[]; const chaves=new Set([...Object.keys(antes||{}),...Object.keys(depois||{})]);
  chaves.forEach(k=>{ if(JSON.stringify(antes[k])!==JSON.stringify(depois[k])) campos.push(k); });
  return campos.length? esc(campos.join(', ')) : '(sem alteração detectável)';
}
async function renderAuditoria(){
  $('#barra').innerHTML='';
  if(!souGestor()){ $('#conteudo').innerHTML='<div class="card">Seu perfil não tem acesso a esta aba.</div>'; return; }
  $('#conteudo').innerHTML='<h1>Histórico</h1><div class="carregando-inline">Carregando…</div>';

  try{ rows = await rpc('listar_auditoria',{p_token:SESSAO.token, p_limite:300}); }
  catch(e){ $('#conteudo').innerHTML=`<div class="card">Erro ao carregar auditoria: ${esc(e.texto||e.message)}</div>`; return; }
  $('#conteudo').innerHTML=`<h1>Histórico <span class="muted small">últimos ${rows.length} eventos</span></h1><div class="dica">Registro de tudo o que foi alterado no sistema.</div>
  <div class="tbl-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Tabela</th><th>Registro</th><th>O que mudou</th></tr></thead><tbody>
  ${rows.map(a=>`<tr><td class="small" style="white-space:nowrap">${esc(fmtData(a.quando))}</td><td>${esc(a.usuario_login||'')}</td><td>${esc(a.acao)}</td><td>${esc(a.tabela||'')}</td><td>${esc(a.registro_id||'')}</td><td class="small">${resumoDiff(a.antes,a.depois)}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Sem registros.</td></tr>'}
  </tbody></table></div>`;
}

function abrirFormEmenda(municipioSugerido, emendaId){

      <label>Município<input id="fe-municipio" list="dl-municipios" value="${esc(dados.municipio?tituloCase(dados.municipio):'')}" ${editando?'disabled':''} required></label>

      <div class="form-acoes"><button type="button" class="btn" id="fe-cancelar">Cancelar</button><button type="submit" class="btn primary">Continuar</button></div>
    </form>`;
  abrirModal(corpo);
  $('#fe-cancelar').addEventListener('click', fecharModal);
  $('#f-emenda').addEventListener('submit', ev=>{
    ev.preventDefault();
    const p={ municipio: $('#fe-municipio').value.trim(), ministerio:$('#fe-ministerio').value.trim(), ano:$('#fe-ano').value.trim(), objeto:$('#fe-objeto').value.trim(), valor:parseFloat($('#fe-valor').value)||0, situacao:$('#fe-situacao').value.trim() };
    if(!p.municipio||!p.ministerio||!p.ano||!p.objeto||!p.situacao){ toast('Preencha todos os campos.','erro'); return; }
    confirmarEmenda(p, editando?emendaId:null);
  });
}
function confirmarEmenda(p, emendaId){
  const linhas=[['Município',tituloCase(p.municipio)],['Ministério',p.ministerio],['Ano',p.ano],['Objeto',p.objeto],['Valor',brl(p.valor)],['Situação',p.situacao]];
  const corpo=`<h2>Confira antes de gravar</h2><p class="small muted">Confira cada campo com atenção antes de confirmar.</p><dl class="kv confirm">${linhas.map(([k,v])=>`<dt>${esc(k)}</dt><dd style="font-size:15px">${esc(v)}</dd>`).join('')}</dl>
    <div class="form-acoes"><button type="button" class="btn" id="cfe-voltar">Voltar e corrigir</button><button type="button" class="btn ok" id="cfe-confirmar">Confirmar e gravar</button></div>`;
  abrirModal(corpo);
  $('#cfe-voltar').addEventListener('click', ()=>abrirFormEmenda(p.municipio, emendaId));
  $('#cfe-confirmar').addEventListener('click', async ()=>{
    try{
      if(emendaId!=null){
        await rpc('atualizar_emenda',{p_token:SESSAO.token,p_id:emendaId,p:{ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor:p.valor,situacao:p.situacao}});
        const achado=acharEmendaPorId(emendaId);
        if(achado) Object.assign(achado.emenda,{ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor:p.valor,situacao:p.situacao,situacao_grupo:grupoSituacao(p.situacao)});
      } else {
        const alvo=acharMunicipioPorNome(p.municipio);
        if(!alvo){ toast('Município não encontrado na base. Verifique o nome (escolha da lista de sugestões).','erro'); return; }
        const r=await rpc('inserir_emenda',{p_token:SESSAO.token,p:{municipio_id:alvo.id,ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor:p.valor,situacao:p.situacao}});
        alvo.emendas.push({id:r.id,ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor:p.valor,situacao:p.situacao,situacao_grupo:grupoSituacao(p.situacao)});
      }
      aposGravar('Registrado com sucesso.');
    }catch(e){ toast(e.texto||e.message,'erro'); }
  });
}
function excluirEmenda(id){
  if(bloqueadoSemInternet()) return;
  const achado=acharEmendaPorId(id); if(!achado) return;
  confirmarAcao(`Excluir a emenda "${achado.emenda.objeto}" de ${tituloCase(achado.municipio.municipio)}?`, async ()=>{
    try{ await rpc('excluir_emenda',{p_token:SESSAO.token,p_id:id}); achado.municipio.emendas=achado.municipio.emendas.filter(e=>e.id!==id); aposGravar('Emenda excluída.'); }
    catch(e){ toast(e.texto||e.message,'erro'); }
  }, {titulo:'Confirmar exclusão', label:'Excluir'});
}

    const p={ municipio:$('#fo-municipio').value.trim(), ministerio:$('#fo-ministerio').value.trim(), ano:$('#fo-ano').value.trim(), objeto:$('#fo-objeto').value.trim(), valor_solicitado: $('#fo-valor').value?parseFloat($('#fo-valor').value):null, recebido:$('#fo-recebido').value.trim(), data_recebido:$('#fo-data').value.trim(), solicitante:$('#fo-solicitante').value.trim(), atendido:$('#fo-atendido').value.trim() };
    if(!p.municipio||!p.ministerio||!p.ano||!p.objeto){ toast('Preencha ao menos município, ministério, ano e pedido.','erro'); return; }
    confirmarOficio(p, editando?oficioId:null);
  });
}
function confirmarOficio(p, oficioId){
  const linhas=[['Município',tituloCase(p.municipio)],['Ministério',p.ministerio],['Ano',p.ano],['Pedido',p.objeto],['Valor solicitado',p.valor_solicitado?brl(p.valor_solicitado):'sem valor'],['Como chegou',p.recebido||'—'],['Data',p.data_recebido||'—'],['Quem pediu',p.solicitante||'—'],['Atendido',p.atendido||'não']];
  const corpo=`<h2>Confira antes de gravar</h2><p class="small muted">Confira cada campo com atenção antes de confirmar.</p><dl class="kv confirm">${linhas.map(([k,v])=>`<dt>${esc(k)}</dt><dd style="font-size:15px">${esc(v)}</dd>`).join('')}</dl>
    <div class="form-acoes"><button type="button" class="btn" id="cfo-voltar">Voltar e corrigir</button><button type="button" class="btn ok" id="cfo-confirmar">Confirmar e gravar</button></div>`;
  abrirModal(corpo);
  $('#cfo-voltar').addEventListener('click', ()=>abrirFormOficio(p.municipio, oficioId));
  $('#cfo-confirmar').addEventListener('click', async ()=>{
    try{
      if(oficioId!=null){
        await rpc('atualizar_oficio',{p_token:SESSAO.token,p_id:oficioId,p:{ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor_solicitado:p.valor_solicitado,recebido:p.recebido,data_recebido:p.data_recebido,solicitante:p.solicitante,atendido:p.atendido}});
        const achado=acharOficioPorId(oficioId);
        if(achado) Object.assign(achado.oficio,{ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor_solicitado:p.valor_solicitado,recebido:p.recebido,data_recebido:p.data_recebido,solicitante:p.solicitante,atendido:p.atendido,atendido_flag:(p.atendido||'').trim()?'SIM':'NÃO'});
      } else {
        const alvo=acharMunicipioPorNome(p.municipio);
        if(!alvo){ toast('Município não encontrado na base. Verifique o nome (escolha da lista de sugestões).','erro'); return; }
        const r=await rpc('inserir_oficio',{p_token:SESSAO.token,p:{municipio_id:alvo.id,ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor_solicitado:p.valor_solicitado,recebido:p.recebido,data_recebido:p.data_recebido,solicitante:p.solicitante,atendido:p.atendido}});
        alvo.oficios.push({id:r.id,ministerio:p.ministerio,ano:p.ano,objeto:p.objeto,valor_solicitado:p.valor_solicitado,recebido:p.recebido,data_recebido:p.data_recebido,solicitante:p.solicitante,atendido:p.atendido,atendido_flag:(p.atendido||'').trim()?'SIM':'NÃO'});
      }
      aposGravar('Registrado com sucesso.');
    }catch(e){ toast(e.texto||e.message,'erro'); }
  });
}
function excluirOficio(id){
  if(bloqueadoSemInternet()) return;
  const achado=acharOficioPorId(id); if(!achado) return;
  confirmarAcao(`Excluir o ofício "${achado.oficio.objeto}" de ${tituloCase(achado.municipio.municipio)}?`, async ()=>{
    try{ await rpc('excluir_oficio',{p_token:SESSAO.token,p_id:id}); achado.municipio.oficios=achado.municipio.oficios.filter(o=>o.id!==id); aposGravar('Ofício excluído.'); }
    catch(e){ toast(e.texto||e.message,'erro'); }
  }, {titulo:'Confirmar exclusão', label:'Excluir'});
}

// ---------- MUNICÍPIO: novo / editar / excluir (gestor) ----------
function abrirFormMunicipio(nomeExistente){
  if(bloqueadoSemInternet()) return;
  const editando = !!nomeExistente;
  const m = editando ? acharMunicipioPorNome(nomeExistente) : null;
  if(editando && !m){ toast('Município não encontrado.','erro'); return; }
  const p=(m&&m.prefeito)||{}, v=(m&&m.vice_prefeito)||{}, pc=(m&&m.presidente_camara)||{};
  const val = x => x==null?'':x;
  const corpo = `<h2>${editando?'Editar dados do município':'Novo município'}</h2>
  <form id="f-municipio" class="form-grid">
    <label>Nome do município<input id="fm-nome" value="${esc(m?tituloCase(m.municipio):'')}" required></label>
    <label>Região<input id="fm-regiao" value="${esc(val(m&&m.regiao))}"></label>
    <label>População<input id="fm-populacao" type="number" value="${val(m&&m.populacao)}"></label>
    <label>Eleitores 2024<input id="fm-eleitores" type="number" value="${val(m&&m.eleitores_2024)}"></label>
    <label>IDH<input id="fm-idh" type="number" step="0.001" value="${val(m&&m.idh)}"></label>
    <label>Aniversário da cidade<input id="fm-aniversario" value="${esc(val(m&&m.aniversario))}"></label>
    <h3>Prefeito(a)</h3>
    <label>Nome<input id="fm-pref-nome" value="${esc(val(p.nome))}"></label>
    <label>Partido<input id="fm-pref-partido" value="${esc(val(p.partido))}"></label>
    <label>Telefones (separados por vírgula)<input id="fm-pref-telefones" value="${esc((p.telefones||[]).join(', '))}"></label>
    <label>E-mail<input id="fm-pref-email" type="email" value="${esc(val(p.email))}"></label>
    <h3>Primeira-dama / cônjuge</h3>
    <label class="grow">Texto<input id="fm-primeira-dama" value="${esc(val(m&&(typeof m.primeira_dama==='string'?m.primeira_dama:'')))}"></label>
    <h3>Vice-prefeito(a)</h3>
    <label>Nome<input id="fm-vice-nome" value="${esc(val(v.nome))}"></label>
    <label>Partido<input id="fm-vice-partido" value="${esc(val(v.partido))}"></label>
    <label>Telefones<input id="fm-vice-telefones" value="${esc((v.telefones||[]).join(', '))}"></label>
    <h3>Presidente da Câmara</h3>
    <label>Nome<input id="fm-pcam-nome" value="${esc(val(pc.nome))}"></label>
    <label>Partido<input id="fm-pcam-partido" value="${esc(val(pc.partido))}"></label>
    <label>Telefones<input id="fm-pcam-telefones" value="${esc((pc.telefones||[]).join(', '))}"></label>
    <h3>PSD e política</h3>
    <label class="grow">Secretário(a) de Saúde<input id="fm-sec-saude" value="${esc(val(m&&m.secretario_saude))}"></label>
    <label class="grow">Presidente do PSD<input id="fm-psd-presidente" value="${esc(val(m&&m.psd_presidente))}"></label>
    <label class="grow">Representantes PSD (texto)<input id="fm-psd-repr-texto" value="${esc(val(m&&m.psd_representantes_texto))}"></label>
    <label>Representantes PSD (nº)<input id="fm-psd-repr-num" type="number" value="${val(m&&m.psd_representantes)}"></label>
    <label class="grow">Vereador(es) PSD<input id="fm-vereadores-psd" value="${esc(val(m&&m.vereadores_psd))}"></label>
    <label class="grow">Deputado federal parceiro<input id="fm-dep-federal" value="${esc(val(m&&m.dep_federal))}"></label>
    <label class="grow">Deputado estadual parceiro<input id="fm-dep-estadual" value="${esc(val(m&&m.dep_estadual))}"></label>
    <label class="grow">Companheiros<textarea id="fm-companheiros" rows="2">${esc(val(m&&m.companheiros))}</textarea></label>
    <label class="grow">Eleição 2020<textarea id="fm-eleicao-2020" rows="2">${esc(val(m&&m.eleicao_2020))}</textarea></label>
    <label class="grow">Eleição 2024<textarea id="fm-eleicao-2024" rows="2">${esc(val(m&&m.eleicao_2024))}</textarea></label>
    <label class="grow">Observações (uma por linha)<textarea id="fm-observacoes" rows="3">${esc((m&&m.observacoes||[]).join('\n'))}</textarea></label>
    <div class="form-acoes"><button type="button" class="btn" id="fm-cancelar">Cancelar</button><button type="submit" class="btn primary">Continuar</button></div>
  </form>`;
  abrirModal(corpo);
  $('#fm-cancelar').addEventListener('click', fecharModal);
  $('#f-municipio').addEventListener('submit', ev=>{
    ev.preventDefault();
    const tel=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
    const num=sel=>{ const v=$(sel).value; return v===''?null:Number(v); };
    const d = {
      nome: $('#fm-nome').value.trim(),
      regiao: $('#fm-regiao').value.trim(),
      populacao: num('#fm-populacao'), eleitores_2024: num('#fm-eleitores'), idh: num('#fm-idh'),
      aniversario: $('#fm-aniversario').value.trim(),
      prefeito: { nome:$('#fm-pref-nome').value.trim(), partido:$('#fm-pref-partido').value.trim(), telefones:tel($('#fm-pref-telefones').value), email:$('#fm-pref-email').value.trim() },
      primeira_dama: $('#fm-primeira-dama').value.trim(),
      vice_prefeito: { nome:$('#fm-vice-nome').value.trim(), partido:$('#fm-vice-partido').value.trim(), telefones:tel($('#fm-vice-telefones').value) },
      presidente_camara: { nome:$('#fm-pcam-nome').value.trim(), partido:$('#fm-pcam-partido').value.trim(), telefones:tel($('#fm-pcam-telefones').value) },
      secretario_saude: $('#fm-sec-saude').value.trim(),
      psd_presidente: $('#fm-psd-presidente').value.trim(),
      psd_representantes_texto: $('#fm-psd-repr-texto').value.trim(),
      psd_representantes: num('#fm-psd-repr-num'),
      vereadores_psd: $('#fm-vereadores-psd').value.trim(),
      dep_federal: $('#fm-dep-federal').value.trim(),
      dep_estadual: $('#fm-dep-estadual').value.trim(),
      companheiros: $('#fm-companheiros').value.trim(),
      eleicao_2020: $('#fm-eleicao-2020').value.trim(),
      eleicao_2024: $('#fm-eleicao-2024').value.trim(),
      observacoes: $('#fm-observacoes').value.split('\n').map(s=>s.trim()).filter(Boolean),
    };
    if(!d.nome){ toast('Informe o nome do município.','erro'); return; }
    confirmarMunicipio(d, editando?nomeExistente:null);
  });
}
function confirmarMunicipio(d, nomeAnterior){
  const linhas=[['Nome',tituloCase(d.nome)],['Região',d.regiao||'—'],['População',d.populacao??'—'],['Eleitores 2024',d.eleitores_2024??'—'],['Prefeito(a)',d.prefeito.nome?tituloCase(d.prefeito.nome)+(d.prefeito.partido?' ('+d.prefeito.partido+')':''):'—']];
  const corpo=`<h2>Confira antes de gravar</h2><dl class="kv confirm">${linhas.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(String(v))}</dd>`).join('')}</dl><p class="small muted">Os demais campos preenchidos também serão gravados.</p>
  <div class="form-acoes"><button type="button" class="btn" id="cfm-voltar">Voltar e corrigir</button><button type="button" class="btn ok" id="cfm-confirmar">Confirmar e gravar</button></div>`;
  abrirModal(corpo);
  $('#cfm-voltar').addEventListener('click', ()=>abrirFormMunicipio(nomeAnterior));
  $('#cfm-confirmar').addEventListener('click', async ()=>{
    const nomeFinal = d.nome.toUpperCase();
    const { nome, regiao, ...dadosRest } = d;
    try{
      if(nomeAnterior){
        const alvo = acharMunicipioPorNome(nomeAnterior);
        if(!alvo){ toast('Município não encontrado.','erro'); return; }
        await rpc('atualizar_municipio',{p_token:SESSAO.token,p_id:alvo.id,p:{nome:nomeFinal, regiao, dados:dadosRest}});
        alvo.municipio = nomeFinal; alvo.regiao = regiao; Object.assign(alvo, dadosRest);
        if(estado.mun===nomeAnterior) estado.mun=nomeFinal;
      } else {
        const r = await rpc('inserir_municipio',{p_token:SESSAO.token,p:{nome:nomeFinal, regiao, tipo:'municipio', dados:dadosRest}});
        DADOS.push(Object.assign({id:r.id, municipio:nomeFinal, tipo:'municipio', regiao, emendas:[], oficios:[]}, dadosRest));
      }
      aposGravar('Município gravado com sucesso.');
    }catch(e){ toast(e.texto||e.message,'erro'); }
  });
}
function excluirMunicipio(nome){
  if(bloqueadoSemInternet()) return;
  const m=acharMunicipioPorNome(nome); if(!m) return;
  confirmarAcao(`Excluir o município ${tituloCase(m.municipio)} e todos os seus registros (emendas e ofícios)? Esta ação não pode ser desfeita.`, async ()=>{
    try{
      await rpc('excluir_municipio',{p_token:SESSAO.token,p_id:m.id});
      DADOS=DADOS.filter(x=>x.id!==m.id);
      if(estado.mun===nome) estado.mun=null;
      recalcular(); fecharModal(); toast('Município excluído.');
      if(!estado.mun) go('municipios'); else render();
    }catch(e){ toast(e.texto||e.message,'erro'); }
  }, {titulo:'Confirmar exclusão', label:'Excluir'});
}

// ---------- trocar senha (botão do cabeçalho) ----------
function abrirTrocarSenha(){
  if(bloqueadoSemInternet()) return;
  const corpo=`<h2>Trocar senha</h2><form id="f-trocar-senha" class="form-grid">
    <label>Nova senha<input id="ts-nova" type="password" required></label>
    <label>Repetir nova senha<input id="ts-nova2" type="password" required></label>
    <div id="ts-erro" class="form-erro hidden"></div>
    <div class="form-acoes"><button type="button" class="btn" id="ts-cancelar">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
  </form>`;
  abrirModal(corpo);
  $('#ts-cancelar').addEventListener('click', fecharModal);
  $('#f-trocar-senha').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const n1=$('#ts-nova').value, n2=$('#ts-nova2').value;
    if(n1!==n2){ mostrarErroForm('ts-erro','As senhas não coincidem.'); return; }
    if(!n1||n1==='12345'){ mostrarErroForm('ts-erro','A senha não pode ser vazia nem "12345".'); return; }
    try{ await rpc('trocar_senha',{p_token:SESSAO.token,p_nova:n1}); SESSAO.usuario.precisa_trocar=false; fecharModal(); toast('Senha alterada.'); }
    catch(e){ mostrarErroForm('ts-erro', e.texto||e.message); }
  });
}

// ---------- cabeçalho / permissões na tela ----------
function renderCabecalho(){
  if(!SESSAO) return;
  const u=SESSAO.usuario;
  $('#userbox').innerHTML = `<span class="userinfo">${esc(u.nome)} <span style="opacity:.75">(${rotuloPapel(u.papel)})</span></span>
    <span class="atualizacao" id="userbox-atualizacao">${esc(textoAtualizacao())}</span>
    <button class="btn sm" id="btn-atualizar-agora" type="button" title="Buscar informação mais nova agora">↻ Atualizar agora</button>
    <button class="btn sm" id="btn-trocar-senha" type="button">Trocar senha</button>
    <button class="btn sm" id="btn-sair" type="button">Sair</button>`;
  $('#btn-atualizar-agora').addEventListener('click', atualizarAgora);
  $('#btn-trocar-senha').addEventListener('click', ()=>{ fecharMenu(); abrirTrocarSenha(); });
  $('#btn-sair').addEventListener('click', sair);
  $$('.so-gestor').forEach(el=>el.classList.toggle('hidden', u.papel!=='gestor'));
  atualizarRodape();
  atualizarFaixaOffline();
}

// ---------- render (despacho por aba) ----------
function render(){
  if(estado.mun){ if(byName[estado.mun]) renderFicha(byName[estado.mun]); else { estado.mun=null; renderPainel(); } return; }
  ({painel:renderPainel,municipios:renderMunicipios,emendas:renderEmendas,oficios:renderOficios,contatos:renderContatos,busca:renderBusca,usuarios:renderUsuarios,auditoria:renderAuditoria}[estado.tab]||renderPainel)();
}

// ---------- overlays de tela cheia ----------
function mostrarOverlay(id){ ['login-overlay','troca-overlay','carregando'].forEach(o=>{ const el=$('#'+o); if(el) el.classList.toggle('hidden', o!==id); }); }
function esconderOverlays(){ mostrarOverlay(null); }
function mostrarLogin(msgErro){ esconderOverlays(); mostrarOverlay('login-overlay'); if(msgErro) mostrarErroForm('li-erro', msgErro); }

// ---------- carregar dados após login ----------
async function carregarTudo(){
  mostrarOverlay('carregando');
  try{
    if(!navigator.onLine) throw new RpcError('SEM_CONEXAO','Sem internet.');
    const arr = await comTempoLimite(rpc('carregar_dados', {p_token:SESSAO.token}), 8000);
    DADOS = arr;
    recalcular();
    ULTIMA_ATUALIZACAO = new Date();
    OFFLINE = false;
    idbSalvar({chave:'dados', dados:arr, quando:ULTIMA_ATUALIZACAO.toISOString(), usuario:SESSAO.usuario});
    esconderOverlays();
    renderCabecalho();
    go('painel');
  }catch(e){
    if(e instanceof RpcError && e.codigo==='SESSAO_INVALIDA'){ esconderOverlays(); return; }
    const usadoCache = await tentarUsarCache(SESSAO.token);
    if(!usadoCache){ esconderOverlays(); toast(e.texto||e.message,'erro'); }
  }
}

// ---------- usar dados salvos no aparelho (sem internet) ----------
async function tentarUsarCache(token){
  const reg = await idbLer('dados');
  const usuario = (SESSAO && SESSAO.usuario) || (reg && reg.usuario);
  if(!reg || !reg.dados || !usuario) return false;
  SESSAO = {token, usuario};
  DADOS = reg.dados;
  recalcular();
  ULTIMA_ATUALIZACAO = reg.quando ? new Date(reg.quando) : null;
  OFFLINE = true;
  esconderOverlays();
  renderCabecalho();
  go('painel');
  return true;
}

// ---------- re-sincronizar (botão "Atualizar agora", voltar internet, voltar ao app) ----------
async function sincronizar(manual){
  if(!SESSAO) return;
  if(manual) toast('Atualizando…');
  try{
    if(!navigator.onLine) throw new RpcError('SEM_CONEXAO','Sem internet.');
    const arr = await comTempoLimite(rpc('carregar_dados', {p_token:SESSAO.token}), 8000);
    DADOS = arr;
    recalcular();
    ULTIMA_ATUALIZACAO = new Date();
    OFFLINE = false;
    idbSalvar({chave:'dados', dados:arr, quando:ULTIMA_ATUALIZACAO.toISOString(), usuario:SESSAO.usuario});
    renderCabecalho();
    if(estado.mun && !byName[estado.mun]) estado.mun=null;
    render();
    toast('Informação atualizada.');
  }catch(e){
    if(e instanceof RpcError && e.codigo==='SESSAO_INVALIDA') return;
    OFFLINE = true;
    renderCabecalho();
    if(manual) toast('Não foi possível atualizar agora. Confira sua internet.','erro');
  }
}
function atualizarAgora(){ sincronizar(true); }
function ligarEventosRede(){
  window.addEventListener('online', () => { if(SESSAO) sincronizar(false); });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState!=='visible' || !SESSAO || !navigator.onLine) return;
    const passouTempo = !ULTIMA_ATUALIZACAO || (Date.now()-ULTIMA_ATUALIZACAO.getTime()) > 10*60*1000;
    if(passouTempo) sincronizar(false);
  });
}

// ---------- app instalável: registro do service worker ----------
function registrarSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(sessionStorage.getItem('cmgo_sw_recarregou')) return;
    sessionStorage.setItem('cmgo_sw_recarregou','1');
    location.reload();
  });
}

// ---------- login / sessão / sair ----------
$('#form-login').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const login=$('#li-login').value.trim(), senha=$('#li-senha').value;
  $('#li-erro').classList.add('hidden');
  if(!login||!senha) return;
  try{
    const r = await rpc('login',{p_login:login,p_senha:senha});
    localStorage.setItem('cmgo_token', r.token);
    SESSAO = {token:r.token, usuario:r.usuario};
    if(SESSAO.usuario.precisa_trocar){ mostrarOverlay('troca-overlay'); }
    else { await carregarTudo(); }
  }catch(e){ mostrarErroForm('li-erro', e.texto||e.message||'Não foi possível entrar.'); }
});
$('#form-troca-obrig').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const n1=$('#to-nova').value, n2=$('#to-nova2').value;
  if(n1!==n2){ mostrarErroForm('to-erro','As senhas não coincidem.'); return; }
  if(!n1||n1==='12345'){ mostrarErroForm('to-erro','A senha não pode ser vazia nem "12345".'); return; }
  try{ await rpc('trocar_senha',{p_token:SESSAO.token,p_nova:n1}); SESSAO.usuario.precisa_trocar=false; await carregarTudo(); }
  catch(e){ mostrarErroForm('to-erro', e.texto||e.message); }
});
async function sair(){
  try{ if(SESSAO) await rpc('sair',{p_token:SESSAO.token}); }catch(e){}
  localStorage.removeItem('cmgo_token');
  location.reload();
}

// ---------- inicialização ----------
async function iniciar(){
  registrarSW();
  ligarEventosRede();
  const token = localStorage.getItem('cmgo_token');
  if(!token){
    mostrarLogin(navigator.onLine ? null : 'Sem internet. Entre com internet pelo menos uma vez neste aparelho para usar sem sinal.');
    return;
  }
  mostrarOverlay('carregando');
  try{
    if(!navigator.onLine) throw new RpcError('SEM_CONEXAO','Sem internet.');
    const r = await comTempoLimite(rpc('sessao', {p_token:token}), 8000);
    SESSAO = {token, usuario:r.usuario};
    if(SESSAO.usuario.precisa_trocar){ mostrarOverlay('troca-overlay'); return; }
    await carregarTudo();
  }catch(e){
    if(e instanceof RpcError && e.codigo==='SESSAO_INVALIDA'){ localStorage.removeItem('cmgo_token'); mostrarLogin(); return; }
    const usadoCache = await tentarUsarCache(token);
    if(!usadoCache) mostrarLogin();
  }
}
iniciar();
</script>
